name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application test
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          response = client.get("/health")

          assert response.status_code == 200
          assert response.json == {"status": "ok"}

          print("CI test passed!")
          PY

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          scp -P "${{ secrets.SERVER_PORT }}" \
            app.py \
            requirements.txt \
            passenger_wsgi.py \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.APP_PATH }}/"

      - name: Install dependencies and restart Passenger
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "source '${{ secrets.VENV_PATH }}/bin/activate' && \
             python -m pip install -r '${{ secrets.APP_PATH }}/requirements.txt' && \
             touch '${{ secrets.APP_PATH }}/tmp/restart.txt'"